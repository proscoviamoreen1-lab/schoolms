{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}
<section class="auth-card"><h1>Welcome back</h1><p>Sign in to manage student records.</p>
<form method="post"><label>Username</label><input name="username" required autocomplete="username">
<label>Password</label><input type="password" name="password" required autocomplete="current-password">
<button>Login</button></form><p class="muted">No account? <a href="{{ url_for('register') }}">Register here</a>.</p></section>
{% endblock %}
